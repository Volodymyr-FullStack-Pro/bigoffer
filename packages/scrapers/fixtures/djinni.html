<html><body><script type="application/ld+json">[{"@context":"https://schema.org/","@type":"JobPosting","applicantLocationRequirements":{"@type":"AdministrativeArea","address":{"@type":"PostalAddress","addressCountry":"UA"}},"category":"JavaScript","datePosted":"2026-10-01T16:00:35.664705","description":"Project Description:\nWe are looking for an experienced React Developer to build a production-grade web application for interacting with a property knowledge graph (ArcadeDB). The UI must support both text-based editing and interactive graph visualisation, enabling business analysts and data engineers to navigate, search, create, and edit graph elements (vertices and edges), as well as run and view reports.\nThe developer will work from Figma wireframes and collaborate closely with backend engineers and business analysts.\nResponsibilities:\n● Convert Figma wireframes into pixel-perfect, production-ready React components\n● Integrate with ArcadeDB's HTTP REST and OpenCypher APIs for live graph data\n● Build an interactive graph editor supporting:\n○ Visual rendering of vertices and edges with type-specific styling\n○ Drag-and-drop vertex placement and repositioning\n○ Edge creation via click-to-connect interactions\n○ Inline property editing on selected vertices/edges\n○ Create, update, and soft-delete operations with confirmation flows\n● Build a text/form-based editor for structured property editing:\n○ JSON/form views for vertex and edge properties\n○ Manual override tracking (flag manually overridden properties visually)\n○ Validation against known property types from the meta-graph\n● Build a search interface:\n○ Natural language search via the search_knowledge_graph API\n○ Cypher query editor with syntax highlighting\n○ Result display in both table and graph view\n● Build navigation and reporting views:\n○ Browsable ontology explorer (process vs. data vertex categories)\n○ Lineage trace visualisation (upstream/downstream from any vertex)\n○ Audit log viewer with timeline and diff display\n○ Tabular reports with filtering, sorting, and export to CSV/Excel\n● Implement environment switching (DEV / UAT / PROD) with visual environment indicators and access controls\n● Maintain component library and design system alignment throughout\nMandatory Skills Description:\nCore\n● React 18+ — hooks, context, performance optimisation (memo, lazy, Suspense)\n● TypeScript — strict typing, interface design for graph data models\n● REST API integration — axios or fetch, async patterns, error handling\n● State management — Redux Toolkit or Zustand (global graph state)\n● Figma — able to extract specs, assets, and implement designs accurately\nGraph Visualisation (Critical)\n● Experience with at least one graph visualisation library:\n○ Cytoscape.js (preferred — flexible, well-documented, supports custom layouts)\n○ React Flow (alternative — excellent for editor-style UIs)\n○ D3.js (for custom/bespoke graph rendering)\n● Understanding of graph layout algorithms (hierarchical, force-directed, dagre)\n● Experience building interactive node/edge editors (not just viewers)\nData & Query\n● Familiarity with graph query languages (Cypher or Gremlin) — sufficient to understand API payloads and display query results correctly\n● Ability to build a code editor component for Cypher queries (CodeMirror or Monaco integration)\nUI/UX\n● Strong CSS skills — CSS Modules or styled-components\n● Responsive layout, accessible components (WCAG AA)\n● Data table experience — virtualized tables for large result sets (TanStack Table / AG Grid)\nNice-to-Have Skills Description:\n● Experience with ArcadeDB, Neo4j, or similar graph databases\n● Knowledge of knowledge graph or data catalog concepts\n● Familiarity with BGE-M3 / semantic search result display patterns\n● Experience building audit log / diff viewers\n● D3.js for custom chart/reporting components\nLanguages:\nEnglish: B2 Upper Intermediate\n","directApply":true,"employmentType":"FULL_TIME","experienceRequirements":{"@type":"OccupationalExperienceRequirements","monthsOfExperience":72},"hiringOrganization":{"@type":"Organization","name":"Luxoft","sameAs":"https://career.luxoft.com/locations/ukraine/"},"identifier":851186,"industry":"fintech","jobLocationType":"TELECOMMUTE","title":"React Developer (Graph Visualisation )","url":"https://djinni.co/jobs/851186-react-developer-graph-visualisation/","validThrough":"2026-10-31T16:00:35.664705"},{"@context":"https://schema.org/","@type":"JobPosting","applicantLocationRequirements":{"@type":"AdministrativeArea","address":{"@type":"PostalAddress","addressCountry":null,"addressLocality":null,"addressRegion":"Europe","postalCode":null}},"category":"JavaScript","datePosted":"2026-10-01T10:34:50.743216","description":"We’re looking for a Web Scraping Developer with hands-on web scraping experience to join a team that builds production-grade web scrapers for enterprise clients.\n\nPractical web scraping experience is required for this role. We’re looking for candidates who have already built scrapers, crawlers, parsers, or other data extraction solutions. General JavaScript experience without hands-on web scraping experience is not sufficient.\n\nYour work will run on enterprise-level web data infrastructure used by some of the world’s most recognizable brands, from Fortune 500 retailers like Nike to global technology companies like Philips, powering market research, price intelligence, and competitive data pipelines.\n\nThis is a hands-on engineering role. From early on, you’ll be building and maintaining real scrapers that extract structured data at scale.\n\nResponsibilities\n\n* Analyze target websites using Chrome DevTools to understand DOM structure, network requests, and data sources\n* Build and maintain web scrapers in JavaScript using Cheerio and related tools\n* Write reliable CSS selectors and XPath expressions to extract required data\n* Use Postman and Chrome DevTools to inspect APIs and identify underlying data endpoints\n* Handle pagination, dynamic content, and different website structures\n* Troubleshoot scraping issues when websites change\n* Deliver clean, structured output data in JSON/CSV according to client specifications\n* Maintain and update existing scrapers\n\nTech Stack\n\nJavaScript, Cheerio, CSS Selectors, XPath, Chrome DevTools, Postman, Git\n\nRequirements\n\n* Hands-on web scraping experience is required\n* Experience building scrapers, crawlers, parsers, or similar data extraction solutions\n* Practical JavaScript experience\n* Good understanding of HTML and DOM structure\n* Confident use of CSS selectors and understanding of XPath\n* Experience using Chrome DevTools to inspect websites and network requests\n* Understanding of HTTP basics, requests, responses, headers, and APIs\n* Ability to extract and transform website data into structured formats such as JSON or CSV\n* English B2 or higher\n* Ability to independently investigate technical problems and work with documentation\n\nPlease apply only if you already have practical web scraping experience. Candidates without hands-on scraping experience will not be considered for this role.\n\nNice to Have\n\n* Commercial web scraping experience\n* Experience with web scraping and data collection platforms such as Oxylabs, Zyte, Bright Data (Luminati), Apify, ScrapingBee, Decodo (Smartproxy), or similar\n* Experience with Cheerio or other HTML parsing libraries\n* Familiarity with Node.js\n* Experience reverse-engineering website APIs\n* Experience working with dynamic or JavaScript-heavy websites\n* Understanding of proxies, proxy rotation, headless browsers, CAPTCHA handling, and common anti-bot mechanisms\n\n","directApply":true,"employmentType":"FULL_TIME","experienceRequirements":{"@type":"OccupationalExperienceRequirements","monthsOfExperience":12},"hiringOrganization":{"@type":"Organization","name":"Olive","sameAs":"https://www.olivesystems.co.il/career"},"identifier":848852,"industry":"other","jobLocationType":"TELECOMMUTE","title":"Web Scraping Developer JS","url":"https://djinni.co/jobs/848852-web-scraping-developer-js/","validThrough":"2026-10-31T10:34:50.743216"},{"@context":"https://schema.org/","@type":"JobPosting","applicantLocationRequirements":[{"@type":"AdministrativeArea","address":{"@type":"PostalAddress","addressCountry":"UKR"}}],"category":"JavaScript","datePosted":"2026-09-30T17:10:06.874020","description":"Хто ми?\nМи — інноваційна IT-компанія, що працює в галузі гемблінгу, надаючи рішення для гральної індустрії на глобальному рівні. Наша команда складається з креативних і цілеспрямованих професіоналів, які створюють продукти, що впливають на ринок. Ми шукаємо молодих талантів, готових приєднатися до нашої команди та стати частиною амбітних проектів.\nЩо ми пропонуємо?\n \nКар’єрний розвиток: Ми інвестуємо в розвиток кожного співробітника та підтримуємо інтернів на всіх етапах навчання. Ти отримаєш можливість працювати з реальними проектами, які матимуть значення для ринку, а не лише стажуватися \"для досвіду\".\nНаставництво: Ти будеш під керівництвом досвідчених менторів, які допоможуть освоїти нові технології та стандарти розробки.\nПерспективи: Після успішного проходження інтернатури ми надамо можливість отримати офер та продовжити роботу в нашій компанії з чіткою траєкторією розвитку на 2-3 роки вперед.\nКультура відкритості: У нас відкритий простір для обговорень, нових ідей та творчого підходу до задач. Ми цінуємо внесок кожного та заохочуємо до розвитку.\nПереваги гемблінг-сфери: Ти отримаєш досвід роботи в індустрії з високими темпами розвитку, де технології випереджають тренди.\n \n\nУмови для інтернів:\n \nТривалість: 2 місяці повний робочий день з повноцінними комерційними завданнями.\nГрафік: Повний робочий день з офісу, з 10:00 до 19:00.\nОплата: Оплачувана інтернатура з конкурентним рівнем компенсації — випробувальний термін 500$ на місяць, який триває 2 місяці, після випробувального 600$.\nНавчання: Постійна підтримка з боку менторів та участь у внутрішніх тренінгах і воркшопах.\nОфіс: Комфортний офіс з усім необхідним для продуктивної роботи.\n \n\nКритерії оцінювання кандидатів:\n \nТехнічні знання: Базове розуміння JavaScript, HTML, CSS, бажано знання фреймворків (Vue, React).\nЗдатність до навчання: Вміння швидко засвоювати нові знання та адаптуватися до нових інструментів і середовищ.\nКомандна робота: Відкритість до співпраці та комунікації в команді.\nІніціативність: Бажання брати на себе відповідальність і пропонувати власні ідеї для вирішення задач.\nПроблемне мислення: Здатність шукати та знаходити рішення, критично мислити та не боятися задавати питання.\n \n\nНеобхідні компетенції:\n \nБазові знання фронтенд-розробки: JavaScript (ES6+), HTML5, CSS3.\nБажано: Ознайомлення з Vue, React або іншими сучасними фреймворками.\nНавички роботи з Git: Початковий досвід роботи з системами контролю версій.\nАнглійська мова: На рівні, достатньому для розуміння технічної документації.\nВiд 21 року\n \n\nПроцес відбору:\n \nПодання заявки: Кандидат надсилає резюме та невелике мотиваційне повідомлення.\nТехнічне онлайн інтерв’ю: Перевірка технічних знань і навичок командної роботи.\nТестове завдання в офісі: Перевірка практичних знань.\nФінальне інтерв’ю з керівником та менеджером: Обговорення деталей інтернатури, можливості розвитку та перспектива довгострокової співпраці.\n \n","directApply":true,"employmentType":"FULL_TIME","experienceRequirements":{"@type":"OccupationalExperienceRequirements","monthsOfExperience":6},"hiringOrganization":{"@type":"Organization","name":"King Group","sameAs":"https://kinggroup.io/"},"identifier":787644,"industry":"gambling","jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressCountry":"Україна","addressLocality":["Київ"],"addressRegion":null,"postalCode":null}},"title":"Intern front-end developer","url":"https://djinni.co/jobs/787644-intern-front-end-developer/","validThrough":"2026-10-30T17:10:06.874020"}]</script></body></html>
